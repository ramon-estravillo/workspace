# 2xxx General Errors
2000=Bad request. Please check input parameters.
2001=Operation not supported or deprecated.
2002=Rate limit exceeded. Please try again.
2003=Request conflict. Operation cannot proceed due to current resource state.
2004=Duplicate resource detected.

# 21xx Validation & Resource State Errors
2100=Resource does not exist.
2101=Resource has been updated by another user.
2102=Failed to update resource due to validation failure.
2103=Mandatory fields do not contain any values.
2104=Field value is out of the allowed range.
2105=Constraint violation: uniqueness or format check failed.
2106=Operation not allowed in current resource state.
2107=Invalid reference to a related resource (foreign key violation).
2108=Attempted to modify a read-only or immutable field.
2109=Required dependent resource is missing.

# 22xx Authentication & Authorization Errors
2200=Authentication. Invalid or missing credentials.
2201=Authorization failed. Access to the resource is denied.
2202=Session has expired. Please log in again.
2203=Token has been revoked or is no longer valid.
2204=User account is locked or disabled.
2205=Insufficient role or permission for this operation.

# 23xx Request Format & Structure Errors
2300=Malformed request body or invalid JSON format.
2301=Missing required request parameters.
2302=Invalid query parameters.
2303=Unsupported media type (e.g., Content-Type not supported).
2304=Request body size exceeds allowed limit.
2305=Invalid enum value or field option.
2306=Invalid date/time or number format.
2307=Pagination parameters are invalid or missing.
2308=Unsupported API version or feature not available.

# 24xx Server & Infrastructure Errors
2400=Internal server error. Please try again later.
2401=Service unavailable. The server is temporarily overloaded or under maintenance.
2402=Timeout occurred while processing the request.
2403=Database error. Unable to complete operation due to SQLException.
2404=Data access error. Failed to retrieve or persist data.
2405=Configuration error. A required system setting is invalid or missing.
2406=Dependency service failure. A downstream system or service did not respond.
2407=File system error. Read/write operation failed on the server.
2408=Unexpected exception encountered during request processing.
2409=Resource lock error. The operation could not be completed due to a locked resource.
