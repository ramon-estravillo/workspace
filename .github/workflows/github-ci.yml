# This is a basic workflow to help you get started with Actions

name: GitHub CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os}}-m2

      - name: Unit Test with JaCoCo
        working-directory: config
        run: mvn clean verify -DskipITs

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os}}-m2

      - name: Integration Test Coverage (Failsafe)
        working-directory: config
        run: mvn clean verify -DskipUTs=true

  sonar-analysis-push:
    name: SonarCloud Analysis on Push
    runs-on: ubuntu-latest
    environment: develop
    if: github.event_name == 'push'
    needs:
      - unit-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarCloud Analysis on Push
        working-directory: config
        run: |
          mvn verify sonar:sonar -DskipTests \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=${{ SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ SONAR_ORGANIZATION }} \
            -Dsonar.host.url=${{ SONAR_HOST_URL }} \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.jacoco.reportPaths=target/jacoco.exec

  sonar-analysis-pull:
    name: SonarCloud Analysis on Pull Request
    runs-on: ubuntu-latest
    environment: develop
    if: github.event_name == 'pull_request'
    needs:
      - unit-test
      - integration-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarCloud Analysis on Push
        working-directory: config
        run: |
          mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=${{ SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ SONAR_ORGANIZATION }} \
            -Dsonar.host.url=${{ SONAR_HOST_URL }} \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.jacoco.reportPaths=target/jacoco.exec