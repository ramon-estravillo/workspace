# Required project metadata
sonar.projectKey=ramon-estravillo_workspace
sonar.projectName=RRC Application
sonar.projectVersion=1.0.0

# Source configuration
sonar.sources=..
sonar.language=java
sonar.inclusions=**/*.java
sonar.java.binaries=target/classes,../rrc-common/**/target/classes

# Optional: Exclude tests and generated code
sonar.exclusions=**/generated/**, **/test/**, **/*Test.java

# Code coverage configuration using JaCoCo
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=\
    ../**/target/site/jacoco-*/jacoco.xml,\
    ../**/**/target/site/jacoco-*/jacoco.xml
